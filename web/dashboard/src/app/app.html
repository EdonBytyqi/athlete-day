<header class="topbar">
  <div class="topbar-row">
    <a class="brand" routerLink="/">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>
        <strong>{{ t('app.name') }}</strong>
        <span class="brand-sub">{{ t('app.sub') }}</span>
      </span>
    </a>
    <button
      type="button"
      class="menu-toggle"
      aria-controls="app-menu"
      [attr.aria-expanded]="menuOpen()"
      (click)="menuOpen.update((open) => !open)"
    >
      <span aria-hidden="true">☰</span> {{ t('app.menu') }}
    </button>
  </div>

  <div id="app-menu" class="topbar-menu" [class.open]="menuOpen()">
    <nav class="tabs" [attr.aria-label]="t('app.screensLabel')">
      @for (screen of persona.screens(); track screen) {
        <a [routerLink]="['/', screen]" routerLinkActive="active">{{ t(screenLabel(screen)) }}</a>
      }
      <a [href]="staffUrl()" target="_blank" rel="noopener">{{ t('app.staffInput') }}</a>
    </nav>

    <div class="topbar-right">
      <span class="live" [class]="'live ' + realtime.state()" [title]="t('app.realtime', { state: liveLabel() })">
        {{ liveLabel() }}
      </span>
      <label class="persona">
        <span>{{ t('app.viewingAs') }}</span>
        <select (change)="persona.switchTo($any($event.target).value)">
          @for (p of personas; track p.user) {
            <option [value]="p.user" [selected]="p.user === persona.current().user">{{ t(personaLabel(p.user)) }}</option>
          }
        </select>
      </label>
      <app-language-switch />
    </div>
  </div>
</header>

<main class="page">
  <router-outlet />
</main>

<app-toast-outlet />

<footer class="foot">{{ t('app.footer') }}</footer>
